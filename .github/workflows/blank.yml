name: Migration Audit Report

on:
  workflow_dispatch:
    inputs:
      pipeline_repo:
        description: "Repo that runs the migration pipeline"
        default: "kcgh-org/gei-gl2gh-migration"
      pipeline_workflow:
        description: "Migration workflow name"
        default: "GitLab to GitHub Migration Pipeline"
      run_conclusion:
        description: "Which runs to analyse"
        type: choice
        options: [all, success, failure]
        default: all
      since_date:
        description: "Only runs created on/after (YYYY-MM-DD)"
        default: "2026-10-10"
      target_org:
        description: "Target GitHub org"
        default: "kcghorgz"
      log_issue_title:
        description: "Text in the title of the migration log issue"
        default: "migration log"

jobs:
  audit:
    runs-on: [ubuntu-latest]               # same runner label as the migration pipeline
    environment: gl2gh-migration-secrets
    timeout-minutes: 120
    env:
      GH_HOST: github.com
      GH_TOKEN: ${{ secrets.GH_PAT }}
      GH_ENTERPRISE_TOKEN: ${{ secrets.GH_PAT }}
      PIPE_REPO: ${{ inputs.pipeline_repo }}
      PIPE_WF: ${{ inputs.pipeline_workflow }}
      CONCLUSION: ${{ inputs.run_conclusion }}
      SINCE: ${{ inputs.since_date }}
      ORG: ${{ inputs.target_org }}
      ISSUE_TITLE: ${{ inputs.log_issue_title }}
      OUT: audit-report

    steps:
      - name: Check prerequisites
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::GH_PAT not found in gl2gh-migration-secrets"; exit 1; }
          for t in gh jq; do command -v $t >/dev/null || { echo "::error::$t not installed on runner"; exit 1; }; done
          gh api user --jq '"Authenticated as: \(.login)"'
          rm -rf "$OUT"; mkdir -p "$OUT"/{logs,artifacts,issues}

      - name: 1. Pipeline runs + migration/validation job logs
        run: |
          gh run list -R "$PIPE_REPO" --workflow "$PIPE_WF" --limit 500 \
            --json databaseId,status,conclusion,createdAt,displayTitle |
          jq -r --arg c "$CONCLUSION" --arg s "$SINCE" '.[]
            | select(.status=="completed")
            | select($c=="all" or .conclusion==$c)
            | select(.createdAt >= $s)
            | [.databaseId,.createdAt,.conclusion,.displayTitle] | @tsv' > "$OUT/runs.tsv"
          echo "Runs selected: $(wc -l < "$OUT/runs.tsv")"

          printf "run_id\tcreated_at\trun_conclusion\tjob_name\tjob_conclusion\n" > "$OUT/jobs.tsv"
          while IFS=$'\t' read -r id created concl title; do
            d="$OUT/logs/run-$id"; mkdir -p "$d"
            gh api "repos/$PIPE_REPO/actions/runs/$id/jobs?filter=latest&per_page=100" \
              --jq '.jobs[] | [.id, .name, (.conclusion // "")] | @tsv' |
            while IFS=$'\t' read -r jid jname jconcl; do
              printf "%s\t%s\t%s\t%s\t%s\n" "$id" "$created" "$concl" "$jname" "$jconcl" >> "$OUT/jobs.tsv"
              if echo "$jname" | grep -qiE 'migrate-repositories|post-migration-validation'; then
                safe=$(echo "$jname" | tr -c 'A-Za-z0-9._-' '_')
                gh api "repos/$PIPE_REPO/actions/jobs/$jid/logs" > "$d/$safe.log" 2>/dev/null \
                  || echo "WARN: could not download log for job $jid ($jname)"
              fi
            done
            gh run download "$id" -R "$PIPE_REPO" -D "$OUT/artifacts/run-$id" 2>/dev/null || true
          done < "$OUT/runs.tsv"

      - name: 2. Failure and warning lines from job logs
        run: |
          strip='s/^[^:]*:[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z /&/'
          grep -HiE 'fail|error|mismatch' "$OUT"/logs/run-*/*.log > "$OUT/log-failure-lines.txt" || true
          grep -HiE 'warn'                "$OUT"/logs/run-*/*.log > "$OUT/log-warning-lines.txt" || true
          {
            printf "log_file\tfailure_lines\twarning_lines\n"
            for f in "$OUT"/logs/run-*/*.log; do
              [ -f "$f" ] || continue
              printf "%s\t%s\t%s\n" "${f#$OUT/logs/}" "$(grep -ciE 'fail|error|mismatch' "$f")" "$(grep -ciE 'warn' "$f")"
            done
          } > "$OUT/log-counts.tsv"
          # Combine any CSV artifacts (e.g. repos_with_status.csv) with run id
          : > "$OUT/artifact-status-combined.csv"
          find "$OUT/artifacts" -name '*.csv' | sort | while read -r c; do
            run=$(echo "$c" | grep -oE 'run-[0-9]+')
            tail -n +2 "$c" | sed "s/^/$run,/" >> "$OUT/artifact-status-combined.csv"
          done

      - name: 3. Repos in target org
        run: |
          echo "name,visibility,archived,created_at,size_kb" > "$OUT/org-repos.csv"
          gh api "orgs/$ORG/repos?per_page=100&type=all" --paginate \
            --jq '.[] | [.name,.visibility,.archived,.created_at,.size] | @csv' | tr -d '"' | sort >> "$OUT/org-repos.csv"
          echo "Repos in $ORG: $(($(wc -l < "$OUT/org-repos.csv")-1))"

      - name: 4. Migration log issue + warnings per repo
        run: |
          echo "repo,total_issues,log_issue_found,warning_lines,error_lines" > "$OUT/repo-warnings.csv"
          : > "$OUT/warnings-detail.txt"
          tail -n +2 "$OUT/org-repos.csv" | cut -d, -f1 | while read -r r; do
            if ! gh api "repos/$ORG/$r/issues?state=all&per_page=100" --paginate \
                 --jq '.[] | select(.pull_request | not)' > /tmp/issues.json 2>/dev/null; then
              echo "$r,ERROR,,," >> "$OUT/repo-warnings.csv"; continue
            fi
            total=$(jq -s 'length' /tmp/issues.json)
            f="$OUT/issues/$r.md"
            jq -rs --arg t "$ISSUE_TITLE" '.[]
              | select(.title | ascii_downcase | contains($t | ascii_downcase))
              | "### \(.title) (#\(.number))\n\(.body // "")\n"' /tmp/issues.json > "$f"
            if [ -s "$f" ]; then
              found=yes
              w=$(grep -ciE 'warn' "$f" || true); e=$(grep -ciE 'error|fail' "$f" || true)
              grep -iE 'warn' "$f" | sed "s|^|$r: |" >> "$OUT/warnings-detail.txt" || true
            else
              found=no; w=; e=; rm -f "$f"
            fi
            echo "$r,$total,$found,$w,$e" >> "$OUT/repo-warnings.csv"
          done

      - name: 5. Warning types (to spot ignorable ones)
        run: |
          cut -d: -f2- "$OUT/warnings-detail.txt" \
          | sed -E 's#https?://[^ )]+#<url>#g; s/[0-9a-f]{7,40}/<sha>/g; s/[0-9]+/<n>/g; s/"[^"]*"/"<x>"/g; s/^[[:space:]#*>-]+//' \
          | sort | uniq -c | sort -rn > "$OUT/warning-types.txt"

      - name: Summary
        run: |
          {
          echo "## Migration Audit Report"
          echo '```'
          echo "Runs analysed                 : $(wc -l < "$OUT/runs.tsv")"
          cut -f3 "$OUT/runs.tsv" | sort | uniq -c | sed 's/^/   runs /'
          echo "migrate-repositories jobs     :"
          awk -F'\t' 'NR>1 && tolower($4)~/migrate-repositories/{print $5}' "$OUT/jobs.tsv" | sort | uniq -c | sed 's/^/   /'
          echo "post-migration-validation jobs:"
          awk -F'\t' 'NR>1 && tolower($4)~/post-migration-validation/{print $5}' "$OUT/jobs.tsv" | sort | uniq -c | sed 's/^/   /'
          echo
          echo "Repos in org $ORG             : $(($(wc -l < "$OUT/org-repos.csv")-1))"
          echo "   archived=true              : $(awk -F, 'NR>1 && $3=="true"' "$OUT/org-repos.csv" | wc -l)"
          echo "Repos with migration log issue: $(awk -F, 'NR>1 && $3=="yes"' "$OUT/repo-warnings.csv" | wc -l)"
          echo "Repos WITHOUT log issue       : $(awk -F, 'NR>1 && $3=="no"'  "$OUT/repo-warnings.csv" | wc -l)"
          echo "Repos with warnings (>0)      : $(awk -F, 'NR>1 && $4>0'      "$OUT/repo-warnings.csv" | wc -l)"
          echo "Repos with errors (>0)        : $(awk -F, 'NR>1 && $5>0'      "$OUT/repo-warnings.csv" | wc -l)"
          echo "Issue API errors              : $(awk -F, 'NR>1 && $2=="ERROR"' "$OUT/repo-warnings.csv" | wc -l)"
          echo
          echo "Top 15 warning types (count  message):"
          head -15 "$OUT/warning-types.txt"
          echo '```'
          } | tee "$OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-audit-report
          path: audit-report/
          retention-days: 14
