name: Migration Log Report

on:
  workflow_dispatch:
    inputs:
      target_org:
        description: "Target GitHub org"
        default: "kcghorgz"

jobs:
  report:
    runs-on: [ubuntu-latest]               # same runner label as migration pipeline
    environment: gl2gh-migration-secrets
    env:
      GH_HOST: github.com
      GH_TOKEN: ${{ secrets.GH_PAT }}
      GH_ENTERPRISE_TOKEN: ${{ secrets.GH_PAT }}
      ORG: ${{ inputs.target_org }}
      OUT: report

    steps:
      - name: 1 & 2. Repo count and list
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::GH_PAT missing"; exit 1; }
          rm -rf $OUT; mkdir -p $OUT/logs
          gh api "orgs/$ORG/repos?per_page=100&type=all" --paginate --jq '.[].name' | sort > $OUT/repo-list.txt
          echo "Total repos in $ORG: $(wc -l < $OUT/repo-list.txt)" | tee $OUT/summary.txt

      - name: 3. Migration Log comments per repo
        run: |
          echo "repo,log_issue,warnings,errors" > $OUT/warnings-per-repo.csv
          while read -r r; do
            n=$(gh api "repos/$ORG/$r/issues?state=all&per_page=100" \
                --jq '[.[] | select(.title=="Migration Log")][0].number // empty' 2>/dev/null)
            if [ -z "$n" ]; then echo "$r,not-found,," >> $OUT/warnings-per-repo.csv; continue; fi
            gh api "repos/$ORG/$r/issues/$n/comments?per_page=100" --paginate --jq '.[].body' > $OUT/logs/$r.log
            grep -iE 'warn'        $OUT/logs/$r.log | sed "s|^|$r: |" >> $OUT/all-warnings.txt || true
            grep -iE 'error|fail'  $OUT/logs/$r.log | sed "s|^|$r: |" >> $OUT/all-errors.txt   || true
            echo "$r,#$n,$(grep -ciE 'warn' $OUT/logs/$r.log),$(grep -ciE 'error|fail' $OUT/logs/$r.log)" >> $OUT/warnings-per-repo.csv
          done < $OUT/repo-list.txt

      - name: 4. Common warnings
        run: |
          touch $OUT/all-warnings.txt $OUT/all-errors.txt
          norm='s/^[^:]*: //; s/^\[?[0-9T:.\/ -]+Z?\]? *//; s#https?://[^ )]+#<url>#g; s/'"'"'[^'"'"']*'"'"'/<x>/g; s/"[^"]*"/<x>/g; s/[0-9]+/<n>/g'
          sed -E "$norm" $OUT/all-warnings.txt | sort | uniq -c | sort -rn > $OUT/common-warnings.txt
          sed -E "$norm" $OUT/all-errors.txt   | sort | uniq -c | sort -rn > $OUT/common-errors.txt
          {
            echo "Repos with Migration Log : $(grep -vc 'not-found' $OUT/warnings-per-repo.csv | awk '{print $1-1}')"
            echo "Repos without log issue  : $(grep -c 'not-found' $OUT/warnings-per-repo.csv)"
            echo "Repos with warnings      : $(awk -F, 'NR>1 && $3>0' $OUT/warnings-per-repo.csv | wc -l)"
            echo "Repos with errors        : $(awk -F, 'NR>1 && $4>0' $OUT/warnings-per-repo.csv | wc -l)"
            echo; echo "Top warnings (count  message):"; head -20 $OUT/common-warnings.txt
          } | tee -a $OUT/summary.txt
          cat $OUT/summary.txt >> $GITHUB_STEP_SUMMARY

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-log-report
          path: report/
